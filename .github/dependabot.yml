---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      time: "10:30"
      timezone: "Europe/London"
    groups:
      gha-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    # Must stay at or above minimumReleaseAge in pnpm-workspace.yaml (7 days),
    # or pnpm rejects whatever Dependabot proposes.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      time: "10:30"
      timezone: "Europe/London"
    open-pull-requests-limit: 15
    # This is a published package, so Dependabot's default would widen ranges
    # instead of raising them.
    versioning-strategy: increase
    groups:
      npm-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
      # Without group-by, every major lands in one combined PR.
      npm-major:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Tracks the minimum supported runtime in engines.node, not latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
