name: Release to NPM

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      # changesets/action v2 doesn't configure npm auth, so publishing relies on the .npmrc
      # this writes. Without node-version it keeps the Node.js installed above.
      - uses: actions/setup-node@v7
        with:
          registry-url: "https://registry.npmjs.org"
      - uses: tibdex/github-app-token@v1
        id: generate-token
        with:
          app_id: ${{ secrets.GH_WORKFLOW_APP_ID }}
          private_key: ${{ secrets.GH_WORKFLOW_APP_PRIVATE_KEY }}        
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          publish-script: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
