name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check