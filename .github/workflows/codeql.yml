name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches new queries shipped in CodeQL releases even when main is quiet.
    - cron: '36 8 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: depot-ubuntu-24.04
            # Only default setup loads .github/codeql/extensions on its own, so the model pack is
            # handed to the CLI here. It extends codeql/actions-all, so it stays off the JS leg.
            extra-options: >-
              {"database": {"run-queries": [
              "--additional-packs=.github/codeql/extensions",
              "--model-packs=team-plain/cli-trusted-actions-owners"]}}
          - language: javascript-typescript
            runner: depot-ubuntu-24.04-4

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # build-mode none reads the sources directly, so there is no pnpm install in this job.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        env:
          CODEQL_ACTION_EXTRA_OPTIONS: ${{ matrix.extra-options }}
        with:
          category: /language:${{ matrix.language }}
